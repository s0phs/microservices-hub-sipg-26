spring.application.name=ms-pagamentos

spring.profiles.active=test
spring.jpa.open-in-view=false

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Porta aleatória para permitir múltiplas instâncias
server.port=0

# Identificador da instância (evita sobrescrever no registry)
eureka.instance.instance-id=${spring.application.name}:${random.int[1,99]}

#Circuit Breaker: monitora as últimas 3 chamadas
resilience4j.circuitbreaker.instances.atualizarPedido.slidingWindowSize=3

# Tipo da janela: por quantidade de chamadas
# COUNT_BASED = últimas N chamadas
# TIME_BASED = ultimos N segundos
resilience4j.circuitbreaker.instances.atualizarPedido.slidingWindowType=COUNT_BASED

# So começa a calcular taxa de falha após pelo menos 2 chamadas
resilience4j.circuitbreaker.instances.atualizarPedido.minimumNumberOfCalls=2

# Abre o circuito quando a taxa de falhas atingir 50%
resilience4j.circuitbreaker.instances.atualizarPedido.failureRateThreshold=50

# Tempo que o circuito permanece OPEN antes de ir para HALF_OPEN
resilience4j.circuitbreaker.instances.atualizarPedido.waitDurationInOpenState=30s

# Em HALF_OPEN, permite 2 chamadas de teste
resilience4j.circuitbreaker.instances.atualizarPedido.permittedNumberOfCallsInHalfOpenState=2